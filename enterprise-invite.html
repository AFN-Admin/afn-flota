<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFN · Activar acceso empresarial</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f9;color:#103f60;margin:0;padding:30px 16px}main{max-width:460px;margin:6vh auto;background:white;border:1px solid #dce6ed;border-radius:18px;padding:28px}h1{font-size:25px}label{display:block;margin:18px 0}input,button{font:inherit;width:100%;padding:12px;border:1px solid #c5d3df;border-radius:8px}button{background:#137447;color:white;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#064f86}</style><main><small>AFN INGENIERÍA DIGITAL</small><h1>Activa tu acceso a AFN Flota</h1><p id="message" role="status">Verificando el enlace recibido por correo…</p><form id="setup" hidden><label>Contraseña nueva<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirma tu contraseña<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button id="submit">Guardar contraseña</button></form><a href="index.html">Volver al inicio de sesión</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const incoming=new URLSearchParams(location.hash.slice(1)),validLink=incoming.has('access_token')&&['invite','recovery'].includes(incoming.get('type'));
const db=createClient('https://xpvpyhgssvrsomdcfuwl.supabase.co','sb_publishable_toRIjPGe0DIKX7iXJ0HL7g_MupGWGfU'),message=document.getElementById('message'),form=document.getElementById('setup'),button=document.getElementById('submit');
// Supabase initializes the fragment session before getSession resolves. No credentials in logs.
const {data,error}=await db.auth.getSession();
const verified=validLink&&data.session?await db.auth.getUser():null;
if(error||!validLink||!data.session||verified?.error||!verified?.data?.user){message.textContent='El enlace no es válido o ya venció. Solicita al administrador de AFN otro enlace de acceso.';}
else{history.replaceState(null,'',location.pathname);message.textContent='Acceso para '+verified.data.user.email+'. Tu empresa ya está configurada. Crea tu contraseña para ingresar.';form.hidden=false;}
form.onsubmit=async event=>{event.preventDefault();if(document.getElementById('password').value!==document.getElementById('confirm').value){message.textContent='Las contraseñas no coinciden.';return;}button.disabled=true;try{const r=await db.auth.updateUser({password:document.getElementById('password').value});if(r.error)throw r.error;await db.auth.signOut();form.reset();form.hidden=true;message.textContent='Contraseña guardada. Ya puedes iniciar sesión en AFN Flota.';}catch(e){message.textContent=e.message||'No se pudo guardar la contraseña.';}finally{button.disabled=false;}};
</script></html>

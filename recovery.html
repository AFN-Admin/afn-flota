<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Restablecer contraseña · AFN Flota</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#063d69;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#163e59}main{width:100%;max-width:460px;background:white;padding:32px;border-radius:18px}img{display:block;width:220px;max-width:100%;margin:0 auto 24px}h1{font-size:25px}label{display:block;margin:16px 0}input,button{font:inherit;border-radius:8px;padding:13px;width:100%;margin-top:7px}input{border:1px solid #bbcbd7}button{background:#179d3b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}a{color:#064c7e}[hidden]{display:none!important}</style></head><body><main><img src="afn-flota-logo.png" alt="AFN Flota"><h1>Crear nueva contraseña</h1><p id="status" role="status">Verificando la liga…</p><form id="form" hidden><label>Nueva contraseña<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirmar contraseña<input id="confirm" type="password" required minlength="8" autocomplete="new-password"></label><button id="save">Guardar contraseña</button></form><p><a href="index.html">Volver a iniciar sesión</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://xpvpyhgssvrsomdcfuwl.supabase.co','sb_publishable_toRIjPGe0DIKX7iXJ0HL7g_MupGWGfU',{auth:{detectSessionInUrl:true}});
const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
try{
 if(params.has('error')||query.has('error'))throw Error('La liga venció o no es válida. Solicita un nuevo correo de recuperación.');
 if(query.has('code')){const r=await db.auth.exchangeCodeForSession(query.get('code'));if(r.error)throw r.error;}
 const {data,error}=await db.auth.getSession();if(error||!data.session)throw Error('La liga venció o no es válida. Solicita un nuevo correo de recuperación.');
 history.replaceState(null,'',location.pathname);$('status').textContent='Escribe una contraseña de al menos 8 caracteres.';$('form').hidden=false;
}catch(e){$('status').textContent='No se pudo verificar la liga. Solicita un nuevo correo desde Recuperar contraseña en AFN Flota.';history.replaceState(null,'',location.pathname);}
$('form').onsubmit=async e=>{e.preventDefault();const password=$('password').value;if(password!==$('confirm').value){$('status').textContent='Las contraseñas no coinciden.';return;}$('save').disabled=true;try{const r=await db.auth.updateUser({password});if(r.error)throw r.error;await db.auth.signOut();$('form').hidden=true;$('status').textContent='Contraseña actualizada. Ya puedes volver a iniciar sesión.';}catch(e){$('status').textContent='No se pudo actualizar la contraseña. Verifica que sea diferente de la anterior o solicita una nueva liga.';}finally{$('save').disabled=false;}};
</script></body></html>
